name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v5.6.0
        with:
          java-version: "24"
          distribution: "temurin"
          cache: maven

      # 项目使用嵌入式 SQLite（无需数据库服务），测试进程经 surefire 使用 target/test.db，
      # 与主库隔离，无需任何 service 容器。
      - name: Build and verify
        run: mvn -B verify
